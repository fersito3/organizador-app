# =============================================================================
# organizador_app – Analysis Options
# =============================================================================
# Professional lint rules for a production-quality Flutter application.
# Base: flutter_lints (recommended by the Flutter team).
# Phase 0: Strict enough for new code, compatible with existing codebase.
# =============================================================================

include: package:flutter_lints/flutter.yaml

analyzer:
  # Treat certain categories as errors to enforce quality in new code.
  errors:
    # Unused imports should be cleaned immediately.
    unused_import: warning
    # Dead code should not accumulate.
    dead_code: warning
  exclude:
    # Generated code by Drift should not be linted.
    - "**/*.g.dart"
    - "**/*.freezed.dart"

linter:
  rules:
    # ── Safety & Correctness ──────────────────────────────────────────────
    avoid_print: true                   # Use debugPrint or proper logging
    avoid_empty_else: true              # Prevent accidental empty else blocks
    avoid_relative_lib_imports: true     # Enforce package: imports for clarity
    cancel_subscriptions: true          # Prevent stream subscription leaks
    close_sinks: true                   # Prevent stream controller leaks
    no_duplicate_case_values: true      # Prevent logic bugs in switch

    # ── Readability & Style ───────────────────────────────────────────────
    prefer_const_constructors: true     # Performance: reduces rebuilds
    prefer_const_declarations: true     # Explicit const where possible
    prefer_const_literals_to_create_immutables: true
    prefer_final_fields: true           # Enforce immutability for privates
    # prefer_final_locals: true        # Re-enable in Phase 2 code polish
    prefer_interpolation_to_compose_strings: true
    prefer_is_empty: true
    prefer_is_not_empty: true
    unnecessary_brace_in_string_interps: true
    unnecessary_const: true
    unnecessary_new: true
    unnecessary_this: true
    use_rethrow_when_possible: true
    use_super_parameters: true          # Modern Dart super-parameters

    # ── Code Hygiene ──────────────────────────────────────────────────────
    always_declare_return_types: true    # Explicit return types for functions
    annotate_overrides: true            # Require @override annotation
    prefer_single_quotes: true          # Consistent quote style
    sort_child_properties_last: true    # Flutter convention: child goes last
    sized_box_for_whitespace: true      # Use SizedBox instead of Container
    use_build_context_synchronously: true # Prevent async BuildContext misuse

    # ── Rules intentionally NOT enabled for Phase 0 ───────────────────────
    # constant_identifier_names: false  # Would require renaming enum values
    # avoid_function_literals_in_foreach_calls: false  # Too noisy for existing code
